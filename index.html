<!DOCTYPE html>
<html>
<head>
  <title>Hand Sand</title>
  <style>
    #container {
      position: relative;
      width: 640px;
      height: 480px;
      transform: scaleX(-1); /* mirror the whole view so it feels natural */
    }
    #output_canvas, #sand_canvas { position: absolute; top: 0; left: 0; }

    #colorPicker {
      width: 640px;
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .swatch {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
    }
    .swatch.selected { border-color: black; }

    #resetBtn {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <video id="input_video" style="display:none;"></video>
  <div id="container">
    <canvas id="output_canvas" width="640" height="480"></canvas>
    <canvas id="sand_canvas" width="640" height="480" style="opacity:0.85;"></canvas>
  </div>

  <div id="colorPicker"></div>
  <button id="resetBtn">Reset</button>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="js/sand.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
